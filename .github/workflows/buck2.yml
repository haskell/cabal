name: buck2

# Builds cabal-install with cabal, uses it to generate a buck2 build of this
# very project (`cabal buck2`), then builds and tests the project with buck2.

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches:
      - buck2
  pull_request:
  workflow_dispatch:

env:
  GHC_VERSION: 9.6.7
  # A dated release of https://github.com/facebook/buck2/releases. The
  # prelude in buck2/ uses `eager_materialization_enabled` (an argument of
  # `ctx.actions.run`) which releases after 2026-09-01 no longer accept, so
  # this can't be moved forward until the prelude is brought up to date.
  BUCK2_VERSION: "2026-09-01"

jobs:
  buck2:
    name: cabal buck2
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The buck2 prelude and support code (buck2/).
          submodules: true

      - name: Install GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: latest

      - name: Install buck2
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-unknown-linux-gnu.zst" \
            | zstd -d > "$HOME/.local/bin/buck2"
          chmod +x "$HOME/.local/bin/buck2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          ghc --version
          cabal --version
          buck2 --version
          # The buck2 toolchain looks the compiler up by versioned name.
          ghc-${GHC_VERSION} --version
          ghc-pkg-${GHC_VERSION} --version

      - name: Update Hackage index
        run: cabal v2-update

      - name: Generate build plan for correct cache key
        run: cabal build all --dry-run

      - name: Get runner OS/version for cache keys
        id: get-osver
        run: echo "osver=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Restore cached dependencies
        uses: actions/cache/restore@v6
        id: cache
        with:
          path: ~/.local/state/cabal
          key: ${{ steps.get-osver.outputs.osver }}-store-buck2-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ steps.get-osver.outputs.osver }}-store-buck2-

      - name: Build cabal-install
        run: cabal build cabal-install:exe:cabal

      # Dependencies are built by cabal as part of `cabal buck2` (as a plain
      # `cabal build --only-dependencies` would); everything in this project
      # is built by buck2. Run a copy of the binary so that the build
      # directory it operates on isn't the one it lives in.
      - name: Generate buck2 build (cabal buck2)
        run: |
          cp "$(cabal list-bin cabal-install:exe:cabal)" "$RUNNER_TEMP/cabal"
          "$RUNNER_TEMP/cabal" buck2

      - name: Cache dependencies
        uses: actions/cache/save@v6
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.local/state/cabal
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: buck2 build
        run: buck2 build //...

      # Tests that are known not to pass under buck2, and so
      # are left out:
      #  - cabal-install:mem-use-tests runs under a deliberately tiny RTS
      #    stack limit (-K1K) that only optimised code fits in, and needs
      #    `--num-threads 1`; the default (unoptimised) buck2 build fails it.
      #  - cabal-benchmarks opens files relative to the project root, but
      #    like `cabal test` buck2 runs a test in its package's directory.
      - name: buck2 test
        run: |
          mapfile -t tests < <(buck2 uquery "kind(sh_test, //...) - set(//cabal-install:mem-use-tests //cabal-benchmarks:cabal-benchmarks)")
          buck2 test "${tests[@]}"
