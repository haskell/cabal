name: Linting

on:
  pull_request:
  push:

jobs:
  hlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/hlint-setup@v2
      with:
        version: "3.10"
    - uses: haskell-actions/hlint-run@v2
      with:
        path: "."
        fail-on: suggestion

  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
    # Findings are reported as warning annotations and do not fail the job.
    # Drop the sed and the "|| true" from a step to make it an error.
    - name: Python formatting (warnings only)
      run: make style-python-format-check RUFF_OUTPUT=github | sed 's/^::error/::warning/' || true
    - name: Python lint (warnings only)
      run: make style-python-lint-check RUFF_OUTPUT=github | sed 's/^::error/::warning/' || true
